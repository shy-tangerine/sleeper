<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="masthead">
      <img src="icon32.png" alt="" class="mark">
      <div>
        <h1>Sleeper</h1>
        <p id="status" class="connection" role="status"><i aria-hidden="true"></i><span>Checking bridge…</span></p>
      </div>
    </header>
    <div class="access-row">
      <span class="eyebrow">Command access</span>
      <p id="scope"></p>
    </div>
    <section class="action-summary" aria-labelledby="activity-heading">
      <div class="section-title">
        <div>
          <span class="eyebrow">Latest</span>
          <h2 id="activity-heading">Activity</h2>
        </div>
        <span id="current-action" class="current-action" role="status">Idle</span>
      </div>
      <ol id="recent-actions" aria-label="Latest three actions"></ol>
      <p id="no-actions" class="empty">No actions yet.</p>
      <button id="log" class="text-button" type="button">View all actions <span aria-hidden="true">→</span></button>
    </section>
    <button id="options" class="settings-button" type="button">Open settings</button>
  </main>
  <script src="action-labels.js"></script>
  <script src="popup.js"></script>
</body>
</html>
